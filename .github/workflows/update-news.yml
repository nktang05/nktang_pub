# Runs newsdesk.py every hour and publishes the page with GitHub Pages.
# Also runs when you click "Run workflow" in the Actions tab, and when the newsdesk inputs change.
name: Update news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'newsdesk-python/sources.json'
      - 'newsdesk-python/settings.json'
      - 'newsdesk-python/template.html'
      - 'newsdesk-python/newsdesk.py'
      - 'newsdesk-python/requirements.txt'

permissions:
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./newsdesk-python
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: newsdesk-python/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Collect the news
        run: python newsdesk.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./newsdesk-python/docs

      - name: Publish the page
        id: deploy
        uses: actions/deploy-pages@v4
