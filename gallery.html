<!-- Photo Modal -->
<div id="photoModal" class="photo-modal">
  <span class="photo-modal__close">&times;</span>

  <div class="photo-modal__content">
    <img id="photoModalImage" class="photo-modal__image" alt="Expanded photo" />

    <!-- Location + notes -->

    </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const modal        = document.getElementById("photoModal");
      const modalImg     = document.getElementById("photoModalImage");
      const modalLoc     = document.getElementById("photoModalLocation");
      const modalNotes   = document.getElementById("photoModalNotes");
      const closeBtn     = document.querySelector(".photo-modal__close");
    
      // Click handlers for images
      document.querySelectorAll(".gallery-item").forEach(item => {
        item.addEventListener("click", () => {
          const img = item.querySelector("img");
    
          modalImg.src = img.src;
          modalLoc.textContent = item.dataset.location ?? "";
    
          // OPTIONAL: pull notes from data-notes=""
          modalNotes.textContent = item.dataset.notes ?? "";
    
          modal.classList.add("is-open");
        });
      });
    
      function closeModal() {
        modal.classList.remove("is-open");
        modalImg.src = "";
        modalLoc.textContent = "";
        modalNotes.textContent = "";
      }
    
      closeBtn.addEventListener("click", closeModal);
    
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
    
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
    });
    </script>
